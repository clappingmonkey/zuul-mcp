# Git hooks for zuul-mcp. Works with both prek (https://github.com/j178/prek)
# and pre-commit (https://pre-commit.com):
#
#   prek install          # or: pre-commit install
#   prek run --all-files  # or: pre-commit run --all-files
#
# The Go hooks run through Bazel, so no local Go toolchain is needed.
# Skip a hook once with SKIP=<id>, e.g. SKIP=golangci-lint git commit ...
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt (via Bazel)
        entry: bazel run --noshow_progress --ui_event_filters=-info,-stderr @rules_go//go -- fmt ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: gazelle
        name: gazelle (BUILD files up to date)
        entry: bazel run --noshow_progress --ui_event_filters=-info,-stderr //:gazelle
        language: system
        files: (\.go|BUILD\.bazel|MODULE\.bazel|go\.mod|go\.sum)$
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint (via Bazel)
        entry: bazel run --noshow_progress --ui_event_filters=-info,-stderr //tools/lint:golangci_lint -- run ./...
        language: system
        files: (\.go|\.golangci\.yml|go\.mod|go\.sum)$
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      # Local commits: scan only what is staged.
      - id: gitleaks
      # CI (manual stage): scan the whole working tree, because a clean
      # checkout has nothing staged and the hook above would scan nothing.
      - id: gitleaks
        alias: gitleaks-tree
        name: Detect hardcoded secrets (whole tree)
        entry: gitleaks dir --redact --verbose .
        stages: [manual]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 0eb9e4a60caf04df64b499ed1e8bef55f4440eae # frozen: v1.33.0
    hooks:
      - id: zizmor

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8 # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
