name: PR Checks

on:
  pull_request:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bazel:
    name: Bazel
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-bazel.yaml # zizmor: ignore[self-repository] -- local reusable workflow, versioned with this commit
    with:
      run-tests: true
      run-build: true

  gazelle:
    name: BUILD files (Gazelle)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: bazel-${{ github.ref_name }}-${{ hashFiles('MODULE.bazel.lock') }}
          repository-cache: true

      - name: Check BUILD files are up to date
        run: |
          bazel run //:gazelle --config=ci
          if [ -n "$(git status --porcelain)" ]; then
            echo "BUILD files are out of date. Run 'bazel run //:gazelle' and commit the changes."
            git diff
            exit 1
          fi

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: bazel-${{ github.ref_name }}-${{ hashFiles('MODULE.bazel.lock') }}
          repository-cache: true

      # Runs every hook in .pre-commit-config.yaml, including golangci-lint.
      # Gazelle has its own job above.
      - name: Run pre-commit hooks (prek)
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: "v0.5.12"
        env:
          SKIP: gazelle

      # The pre-commit gitleaks hook only scans staged changes, so scan the
      # checked-out tree as well.
      - name: Scan the tree for secrets
        run: prek run --hook-stage manual --all-files --show-diff-on-failure gitleaks-tree
