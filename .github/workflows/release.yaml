name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run CI only, skip release-please and publish
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/bazel-ci.yaml
    with:
      run-tests: true
      run-build: true

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ !inputs.dry-run }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: tibdex/github-app-token@v2
        id: app-token
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  publish:
    name: Publish
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/bazel-ci.yaml
    with:
      publish-platforms: '[{"config":"linux_amd64","output":"zuul-mcp-linux-amd64","ext":""},{"config":"linux_arm64","output":"zuul-mcp-linux-arm64","ext":""},{"config":"darwin_amd64","output":"zuul-mcp-darwin-amd64","ext":""},{"config":"darwin_arm64","output":"zuul-mcp-darwin-arm64","ext":""},{"config":"windows_amd64","output":"zuul-mcp-windows-amd64.exe","ext":".exe"}]'
      tag-name: ${{ needs.release-please.outputs.tag_name }}

  upload-release:
    name: Upload to Release
    runs-on: ubuntu-latest
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.release-please.outputs.tag_name }}
          path: dist

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: [release-please, upload-release]
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Download checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download ${{ needs.release-please.outputs.tag_name }} --pattern checksums.txt --dir /tmp

      - name: Generate and push formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          VERSION="${TAG#v}"
          export VERSION
          export DARWIN_ARM64_SHA=$(grep darwin-arm64 /tmp/checksums.txt | awk '{print $1}')
          export DARWIN_AMD64_SHA=$(grep darwin-amd64 /tmp/checksums.txt | awk '{print $1}')
          export LINUX_ARM64_SHA=$(grep linux-arm64 /tmp/checksums.txt | awk '{print $1}')
          export LINUX_AMD64_SHA=$(grep linux-amd64 /tmp/checksums.txt | awk '{print $1}')

          envsubst < .github/formula/zuul-mcp.rb.tpl > /tmp/zuul-mcp.rb

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/clappingmonkey/homebrew-zuul-mcp.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp /tmp/zuul-mcp.rb /tmp/tap/Formula/zuul-mcp.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/zuul-mcp.rb
          git commit -m "zuul-mcp ${VERSION}"
          git push
