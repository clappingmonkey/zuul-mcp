name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run CI only, skip release-please and publish
        type: boolean
        default: false

# Never run two releases at once, and never cancel one half-way through.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/bazel-ci.yaml # zizmor: ignore[self-repository] -- local reusable workflow, versioned with this commit
    with:
      run-tests: true
      run-build: true

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ !inputs.dry-run }}
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Only what release-please needs: release PRs, labels, tags/releases.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  publish:
    name: Publish
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/bazel-ci.yaml # zizmor: ignore[self-repository] -- local reusable workflow, versioned with this commit
    with:
      publish-platforms: '[{"config":"linux_amd64","output":"zuul-mcp-linux-amd64","ext":""},{"config":"linux_arm64","output":"zuul-mcp-linux-arm64","ext":""},{"config":"darwin_amd64","output":"zuul-mcp-darwin-amd64","ext":""},{"config":"darwin_arm64","output":"zuul-mcp-darwin-arm64","ext":""},{"config":"windows_amd64","output":"zuul-mcp-windows-amd64.exe","ext":".exe"}]'
      tag-name: ${{ needs.release-please.outputs.tag_name }}

  upload-release:
    name: Attest and Upload to Release
    runs-on: ubuntu-latest
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # upload release assets
      id-token: write # sign the provenance attestation (Sigstore OIDC)
      attestations: write # store the attestation
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-${{ needs.release-please.outputs.tag_name }}
          path: dist

      # Verify with: gh attestation verify <file> --repo clappingmonkey/zuul-mcp
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: [release-please, upload-release]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release download "${TAG}" --pattern checksums.txt --dir /tmp --repo "${GITHUB_REPOSITORY}"

      - name: Generate and push formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          sha_for() {
            local sha
            sha="$(awk -v f="zuul-mcp-$1" '$2 == f { print $1 }' /tmp/checksums.txt)"
            if [[ ! "${sha}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::no valid sha256 for zuul-mcp-$1 in checksums.txt" >&2
              exit 1
            fi
            echo "${sha}"
          }

          VERSION="${TAG#v}"
          DARWIN_ARM64_SHA="$(sha_for darwin-arm64)"
          DARWIN_AMD64_SHA="$(sha_for darwin-amd64)"
          LINUX_ARM64_SHA="$(sha_for linux-arm64)"
          LINUX_AMD64_SHA="$(sha_for linux-amd64)"
          export VERSION DARWIN_ARM64_SHA DARWIN_AMD64_SHA LINUX_ARM64_SHA LINUX_AMD64_SHA

          # shellcheck disable=SC2016 # the variable list is for envsubst, not the shell
          envsubst '${VERSION} ${DARWIN_ARM64_SHA} ${DARWIN_AMD64_SHA} ${LINUX_ARM64_SHA} ${LINUX_AMD64_SHA}' \
            < .github/formula/zuul-mcp.rb.tpl > /tmp/zuul-mcp.rb

          # Pass the token as an HTTP header through git's environment config,
          # so it is not stored in the remote URL or visible on the command line.
          GIT_CONFIG_COUNT=1
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${HOMEBREW_TAP_TOKEN}" | base64 -w0)"
          export GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git clone https://github.com/clappingmonkey/homebrew-zuul-mcp.git /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp /tmp/zuul-mcp.rb /tmp/tap/Formula/zuul-mcp.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/zuul-mcp.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${VERSION}"
            exit 0
          fi
          git commit -m "zuul-mcp ${VERSION}"
          git push
