name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions: {}

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Renovate needs most of the app's permissions (contents, pull requests,
      # issues, workflows, checks and statuses), so the token is not narrowed.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3 # zizmor: ignore[github-app]
        id: app-token
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: 'info'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["bazelModDeps"]'
          # Permit the postUpgradeTasks command that regenerates
          # MODULE.bazel.lock after a Go SDK bump (see renovate.json5).
          RENOVATE_ALLOWED_COMMANDS: '["^bazel run //:gazelle --config=ci$"]'
