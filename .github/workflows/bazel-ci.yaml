name: Bazel CI

on:
  workflow_call:
    inputs:
      run-tests:
        description: Run bazel test //...
        type: boolean
        default: false
      run-build:
        description: Run bazel build //cmd/zuul-mcp
        type: boolean
        default: false
      publish-platforms:
        description: JSON array of platforms to build for release
        type: string
        default: ''
      tag-name:
        description: Release tag name (required for publish)
        type: string
        default: ''
    outputs:
      artifact-name:
        description: Name of the uploaded artifact containing binaries
        value: ${{ jobs.collect.outputs.artifact-name }}

permissions: {}

jobs:
  test:
    name: Test
    if: inputs.run-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: bazel-${{ github.ref_name }}-${{ hashFiles('MODULE.bazel.lock') }}
          repository-cache: true

      - name: Run tests
        run: bazel test //... --config=ci

  build:
    name: Build
    needs: [test]
    # Runs when test passed or was skipped (run-tests: false), never after a
    # failed or cancelled test job.
    if: ${{ !cancelled() && inputs.run-build && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: bazel-${{ github.ref_name }}-${{ hashFiles('MODULE.bazel.lock') }}
          repository-cache: true

      - name: Build
        run: bazel build //cmd/zuul-mcp --config=ci

  publish:
    name: Build ${{ matrix.platform.config }}
    if: inputs.publish-platforms != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(inputs.publish-platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          # No disk or repository cache for release binaries, so they are
          # built from a clean state. The bazelisk cache only holds the Bazel
          # binary itself, which Bazelisk verifies by checksum.
          bazelisk-cache: true

      - name: Build binary
        env:
          CONFIG: ${{ matrix.platform.config }}
          EXT: ${{ matrix.platform.ext }}
          OUTPUT: ${{ matrix.platform.output }}
        run: |
          bazel build //cmd/zuul-mcp --config="${CONFIG}" --config=ci --config=release
          mkdir -p dist
          cp "bazel-bin/cmd/zuul-mcp/zuul-mcp_/zuul-mcp${EXT}" "dist/${OUTPUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.platform.config }}
          path: dist/
          retention-days: 1

  collect:
    name: Collect Binaries
    if: inputs.publish-platforms != ''
    needs: [publish]
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      artifact-name: dist-${{ inputs.tag-name }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum -- * > checksums.txt
          ls -la
          cat checksums.txt

      - name: Upload combined artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ inputs.tag-name }}
          path: dist/
          retention-days: 5
